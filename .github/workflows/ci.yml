name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project structure
        run: |
          set -euo pipefail
          test -f README.md
          test -f ROADMAP.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f GOVERNANCE.md
          test -d core
          test -d docs
          test -d tests
          test -d examples
          test -d simulation
          test -d ros2
          test -d sdk
          echo "PHYX Core repository structure is valid."
